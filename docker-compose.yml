version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE=mongodb://mongo:27017/expense-tracker
      - SECRET_KEY=${SECRET_KEY:-your_secret_key_here}
      - GEMINI_API_KEY=AIzaSyDhkfk6YsGAGjofupCaNXXEMvj8oP72bEM
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    # Use named volumes for node_modules to avoid overwriting with host directories
    volumes:
      - ./:/app
      - ./config.env:/app/config.env
      - app_node_modules:/app/node_modules
      - client_node_modules:/app/client/node_modules
      - client_build:/app/client/build

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-}

  # MongoDB Web Interface
  mongo-express:
    image: mongo-express:latest
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
  app_node_modules:
  client_node_modules:
  client_build:
