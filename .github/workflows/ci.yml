name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build client
      run: |
        cd client
        npm install --legacy-peer-deps
        npm run build

    - name: Run linting and tests
      run: |
        echo "Add tests here when you have them"
        # npm test
